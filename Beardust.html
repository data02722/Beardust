<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEARDUST // SYSTEM: DOOM</title>
    <!-- Load js-dos CSS -->
    <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
    <style>
        body {
            background-color: #050505;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 1.8rem;
            letter-spacing: 3px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }
        p {
            color: #888;
            font-size: 0.9rem;
            margin-top: 0;
            margin-bottom: 20px;
        }
        #doom-container {
            width: 640px;
            height: 400px;
            border: 2px solid #00ff66;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.2);
            background: #000;
        }
    </style>
</head>
<body>

    <h1>BEARDUST.SYS // DOOM_EXECUTABLE</h1>
    <p>STATUS: ONLINE</p>

    <!-- The container where Doom will run -->
    <div id="doom-container"></div>

    <!-- Load js-dos JavaScript -->
    <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
    <script>
        // Initialize js-dos and boot the stable Doom bundle
        Dos(document.getElementById("doom-container"), {
            url: "https://v8.js-dos.com/bundles/doom.jsdos",
            autostart: true
        });
    </script>

</body>
</html>
